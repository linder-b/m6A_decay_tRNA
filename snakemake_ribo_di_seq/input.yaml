# directory with fasetq files (not gzip compressed)
data_dir: data
# data type is "monosome" or "disome"
data_type: disome 
adapter_seq: CTGTAGGCACCATCAATAGATCGGAAGA
# numbers of random nucleotides at the 5' and 3' end of reads
5_barcode: 3
3_barcode: 6
# parameters for runing STAR mapping
STAR_params: --outFilterMultimapNmax 20 --outSAMmultNmax 1 --outFilterMismatchNoverReadLmax 0.05  --alignEndsType EndToEnd  --outReadsUnmapped Fastx --outSAMtype BAM Unsorted
# Index for STAR mapping
STAR_index: /human/hg38/STAR_hg38_ncRNA_index
# bowtie indext prefix for CDS. 
CDS_index: /human/hg38/hg38_canonical_chrSelected_singleline
# CDS fasta file with sequence in one line
CDS_file: /human/hg38/hg38_canonical_chrSelected_singleline.fa
# numbers of codon excluded at the 5' and 3' end of reads for analysis
exclude_codons: 0
# numbers of nucleotides extended at the 5' and 3' end of CDS.
extend_nt: 21


